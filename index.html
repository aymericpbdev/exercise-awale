<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu d'Awalé</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Awalé</h1>
        <!-- Plateau de jeu -->
        <div class="board">
            <!-- Informations de jeu -->
            <div class="game-info">
                <span>Joueur 1: <strong id="score1">0</strong></span>
                <span id="turn-display">Tour: Joueur 1</span>
                <span>Joueur 2: <strong id="score2">0</strong></span>
            </div>
        <!-- Côté Joueur 2 -->
        <!-- p1-hole-1 => player 1 hole 1 -->
        <div class="player2-side">
            <button class="hole p2-hole-1" data-player="2" data-index="5">4</button>
            <button class="hole p2-hole-2" data-player="2" data-index="4">4</button>
            <button class="hole p2-hole-3" data-player="2" data-index="3">4</button>
            <button class="hole p2-hole-4" data-player="2" data-index="2">4</button>
            <button class="hole p2-hole-5" data-player="2" data-index="1">4</button>
            <button class="hole p2-hole-6" data-player="2" data-index="0">4</button>
        </div>        
        <!-- Côté Joueur 1 -->
        <div class="player1-side">
            <button class="hole p1-hole-1" data-player="1" data-index="0">4</button>
            <button class="hole p1-hole-2" data-player="1" data-index="1">4</button>
            <button class="hole p1-hole-3" data-player="1" data-index="2">4</button>
            <button class="hole p1-hole-4" data-player="1" data-index="3">4</button>
            <button class="hole p1-hole-5" data-player="1" data-index="4">4</button>
            <button class="hole p1-hole-6" data-player="1" data-index="5">4</button>
        </div>
            <!-- Zone de messages -->
            <div id="message"></div>
        </div>
    </div>
    <!--boutons reset vers une nouvelle partie -->
    <button id="reset-button">Nouvelle partie</button>
    <script src="script.js"></script>
</body>
</html>
